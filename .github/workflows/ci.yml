name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS: matches the Vercel runtime the apps deploy to.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Both apps build with no env vars present: firebase.ts guards a missing
      # web config and server/admin.ts initialises adminDb through a lazy proxy,
      # so nothing reads a secret at build time. Verified — do not add secrets
      # here just to make a build pass. If one starts failing without them,
      # something now reads config at module scope, and that is the real bug.
      - run: npm run build:web
      - run: npm run build:knowledge

      # Must run after the builds: Next generates the route/layout types into
      # .next during a build, so a standalone `tsc --noEmit` fails on
      # `Cannot find name 'LayoutProps'`. Verified both ways.
      - run: npm run typecheck

# apps/mobile and packages/shared are both covered now, and neither needs a
# step of its own here: `npm run verify` runs lint across all three apps, and
# `npm run typecheck` runs tsc over packages/shared first and then each app.
#
# This block used to say mobile was excluded because its lint and typecheck
# were red on main (#37). Both pass. The typecheck failure was not the stale
# .expo/types/router.d.ts this note blamed — it was TS2882 on the `@/global.css`
# side-effect import, because Expo's `*.css` declaration only reaches TypeScript
# through the gitignored, generated expo-env.d.ts. apps/mobile/global.d.ts
# references expo/types directly so it survives a fresh clone.
#
# Not covered: there is no mobile build here. The Expo app ships via EAS
# (apps/mobile/eas.json), so a green run on this workflow says nothing about
# whether the app on a device is current.
